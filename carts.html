<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/normolize.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>
  <body>
    <header class="head">
      <section class="head__up">
        <article class="head__profile">
          <aside class="head__logo">
            <svg
              class="head__icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M12 2C17.52 2 22 6.48 22 12C22 17.52 17.52 22 12 22C6.48 22 2 17.52 2 12C2 6.48 6.48 2 12 2ZM6.02332 15.4163C7.49083 17.6069 9.69511 19 12.1597 19C14.6243 19 16.8286 17.6069 18.2961 15.4163C16.6885 13.9172 14.5312 13 12.1597 13C9.78821 13 7.63095 13.9172 6.02332 15.4163ZM12 11C13.6569 11 15 9.65685 15 8C15 6.34315 13.6569 5 12 5C10.3431 5 9 6.34315 9 8C9 9.65685 10.3431 11 12 11Z"
              ></path>
            </svg>
          </aside>
          <h1 class="head__name">User</h1>
        </article>
      </section>

      <section class="head__center">
        <article class="head__cards">
          <button class="head__card">Home</button>
          <a href="dashboard.html"><button class="head__card head__buttonPro">Products</button></a>
          <a href="users.html"><button class="head__card">Users</button></a>
          <button class="head__card head__buttonAn">Analytics</button>
          <button class="head__card">Settings</button>
          <button class="head__card">Carts</button>
        </article>
      </section>
      <section class="head__down">
        <article class="head__buttons">
          <button class="head__button">Log Out</button>
        </article>
      </section>
    </header>


    <main class="main">
      <nav class="nav">
        <h1 class="main__title">Dashboard</h1>
      </nav>

      <div class="cart__wrapper">
        <div class="cart">
          <div class="cart__up">
            <div class="cart__up-left">
              <h1 class="cart__title">Manage Carts</h1>
              <p class="cart__download">
                <span class="cart__span-download">100</span> carts
              </p>
            </div>
            <div class="cart__up-right"></div>
          </div>
          <div class="cart__down">
            <div class="cart__down-left">
              <div class="cart__title-cards cart__cards">
                <div class="cart__title-card cart__card">
                  <p class="cart__title-id cart__id">ID</p>
                </div>
                <div class="cart__title-card cart__card">
                  <p class="cart__title-userid cart__userid">UserId</p>
                </div>
                <div class="cart__title-card cart__card">
                  <p class="cart__title-date cart__date">Date</p>
                </div>
                <div class="cart__title-action-wrapper cart__card">
                  <p class="cart__title-action">Actions</p>
                </div>
              </div>
            </div>
            <div class="cart__down-right">
              <div class="cart__result-wrapper none">
                <div class="cart__result">
                  <div class="cart__products-wrapper">
                    <div class="cart__products">
                      <div class="cart__product">
                        <!-- <p class="cart__product-id">Product's id: ${data.id}</p>
                        <p class="cart__product-quan"><img src="data.image" alt="img" class="cart__product-img"></p>
                        <p class="cart__product-price">Price: ${data.price}</p>
                        <p class="cart__product-quan">Quantity: ${item.quantity}</p>
                        <p class="cart__product-summaPrice">Summarized price: ${summaPrice}</p> -->
                        <button class="cart__product-close">Close</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="scripts/_carts.js"></script>
    <script src="scripts/_dashboard.js"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
  </body>
</html>
